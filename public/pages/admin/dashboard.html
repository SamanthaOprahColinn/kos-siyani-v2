<!-- public/pages/admin/dashboard.html -->

<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Admin — Kos Siyani</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="../../css/global.css" />
  <link rel="stylesheet" href="../../css/admin/dashboard.css" />
</head>

<body>

  <div class="layout">
    <div id="sidebar-container"></div>

    <div class="main">
      <header class="topbar">
        <h1 class="topbar-title">Dashboard Operasional Admin</h1>
        <div id="topbar-container"></div>
      </header>

      <main class="content page-enter">

        <div class="admin-stats">
          <div class="stat-card">
            <div class="stat-icon stat-icon-pink"><i class="ph ph-door"></i></div>
            <div>
              <div class="stat-label">Kamar Terisi</div>
              <div class="stat-value" id="statKamarTerisi">-</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon-green"><i class="ph ph-door-open"></i></div>
            <div>
              <div class="stat-label">Kamar Kosong</div>
              <div class="stat-value" id="statKamarKosong">-</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon stat-icon-cream"><i class="ph ph-users"></i></div>
            <div>
              <div class="stat-label">Total Penghuni</div>
              <div class="stat-value" id="statTotalPenghuni">-</div>
            </div>
          </div>
        </div>

        <div class="admin-grid-layout">

          <div class="table-wrapper">
            <div class="table-top">
              <div>
                <div class="table-top-title">Daftar Penghuni</div>
                <div class="table-top-sub">Data real-time dari database</div>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="fetchPenghuni(); fetchDashboardStats();">
                <i class="ph ph-arrows-clockwise"></i> Segarkan
              </button>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Kamar</th>
                  <th>Nama Penghuni</th>
                  <th>Nomor KTP</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tenantTableBody">
                <tr>
                  <td colspan="4">
                    <div class="table-empty">
                      <i class="ph ph-users"></i>
                      <div class="table-empty-title">Belum ada penghuni</div>
                      <div class="table-empty-sub">Data akan muncul setelah penghuni didaftarkan</div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="table-wrapper quick-action-card">
            <div class="card-section-title">Aksi Cepat</div>
            <div class="quick-action-list">

              <button class="quick-action-btn qab-green"
                onclick="window.location.href='/pages/admin/kelola-penghuni.html'">
                <div class="qab-icon"><i class="ph ph-user-plus"></i></div>
                Registrasi Penghuni Baru
              </button>

              <button class="quick-action-btn qab-pink" 
                onclick="window.location.href='/pages/admin/buat-tagihan.html'">
                <div class="qab-icon"><i class="ph ph-receipt"></i></div>
                Buat Tagihan
              </button>

              <button class="quick-action-btn qab-cream"
                onclick="window.location.href='/pages/admin/kelola-kamar.html'">
                <div class="qab-icon"><i class="ph ph-door-open"></i></div>
                Tambah Kamar
              </button>

            </div>
          </div>
        </div>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <script src="../../js/layout-admin.js"></script>

  <script src="../../js/admin/dashboard.js"></script>
</body>

</html>
