<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Kamar (Admin) — SLEEPYANI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/kelola-kamar.css" />
</head>

<body>

    <div class="layout">
        <div id="sidebar-container"></div>

        <div class="main">
            <header class="topbar">
                <h1 class="topbar-title">Manajemen Kamar Kos</h1>
                <div id="topbar-container"></div>
            </header>

            <main class="content page-enter">
                <div class="kamar-top-action-bar">

                    <div class="filter-action-header-clay">
                        <div class="search-wrapper-clay">
                            <input type="text" id="searchKamar" class="form-input-clay"
                                placeholder="🔍 Cari nomor kamar..." oninput="debounceSearchKamar()" />
                        </div>

                        <div class="sort-wrapper-clay">
                            <select id="sortKamar" class="form-input-clay" onchange="fetchKamar()">
                                <option value="num_asc">🔢 Nomor Kamar (Kecil → Besar)</option>
                                <option value="num_desc">🔢 Nomor Kamar (Besar → Kecil)</option>
                                <option value="newest">✨ Terbaru Ditambahkan</option>
                                <option value="oldest">⏳ Terlama Ditambahkan</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="room-grid" id="kamarGridContainer">
                    <div class="grid-status-message">
                        Memuat data kamar estetikmu...
                    </div>
                </div>

                <div class="trash-action-container">
                    <button class="btn-clay-secondary trash-toggle-btn" onclick="toggleTrashSection()">
                        <i class="ph ph-trash"></i> Lihat Tong Sampah (Kamar Terhapus)
                    </button>
                </div>

                <div id="trashSection" class="trash-section hidden">
                    <h3 class="trash-title">Riwayat Kamar Terhapus</h3>
                    <div class="table-responsive">
                        <table class="trash-table">
                            <thead>
                                <tr>
                                    <th>Nomor Kamar</th>
                                    <th>Tipe</th>
                                    <th>Harga Sewa</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="deletedKamarBody">
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div class="modal-backdrop" id="kamarModal">
        <div class="modal-clay">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Tambah Kamar Baru</h3>
                <button onclick="closeKamarModal()" class="btn-close-modal">
                    <i class="ph ph-x-circle"></i>
                </button>
            </div>

            <form id="formKamar" onsubmit="saveKamar(event)">
                <input type="hidden" id="kamarId" />

                <div class="form-row-2col mb-3">
                    <div class="form-group">
                        <label class="form-label form-label-bold">Nomor Kamar (1-10)</label>
                        <input type="number" class="form-input-clay" id="kNomor" min="1" max="10" required
                            placeholder="Contoh: 1" />
                    </div>
                    <div class="form-group">
                        <label class="form-label form-label-bold">Lantai</label>
                        <select class="form-input-clay" id="kLantai" required>
                            <option value="">-- Pilih Lantai --</option>
                            <option value="1">Lantai 1</option>
                            <option value="2">Lantai 2</option>
                        </select>
                    </div>
                </div>

                <div class="form-row-2col mb-3">
                    <div class="form-group">
                        <label class="form-label form-label-bold">Tipe Kamar</label>
                        <select class="form-input-clay" id="kTipe" required>
                            <option value="">-- Tipe --</option>
                            <option value="A">Tipe A</option>
                            <option value="B">Tipe B</option>
                            <option value="C">Tipe C</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label form-label-bold">Harga Sewa (Rp)</label>
                        <input type="number" class="form-input-clay" id="kHarga" required
                            placeholder="Contoh: 1200000" />
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label form-label-bold">Fasilitas (Pisahkan dengan koma)</label>
                    <input type="text" class="form-input-clay" id="kFasilitas" required
                        placeholder="Contoh: kasur, lemari, ac, wifi" />
                    <small class="form-hint">*Minimal harus diisi 1 fasilitas</small>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label form-label-bold">Deskripsi Kamar (Opsional)</label>
                    <textarea class="form-input-clay textarea-no-resize" id="kDeskripsi" rows="2"
                        placeholder="Kamar menghadap ke timur, ventilasi luas..."></textarea>
                </div>

                <button type="submit" class="btn-clay-primary btn-submit-full" id="btnSubmitKamar">Simpan Kamar</button>
            </form>
        </div>
    </div>

    <script src="../../js/layout-admin.js"></script>
    <script src="../../js/admin/kelola-kamar.js"></script>
</body>

</html>
