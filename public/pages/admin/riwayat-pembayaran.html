<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Pembayaran - Kos Siyani</title>
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/admin/pembayaran.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

  <div class="layout">
    <div id="sidebar-container"></div>

    <div class="main">
      <header class="topbar">
        <h1 class="topbar-title">Manajemen Pembayaran</h1>
        <div id="topbar-container"></div>
      </header>

      <main class="content page-enter">

        <div class="mb-6" style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1 class="topbar-title" style="padding-left: 0;">Riwayat Pembayaran</h1>
            <p class="stat-sub">Pantau seluruh status tagihan (Lunas, Belum Bayar, Menunggu Konfirmasi).</p>
          </div>
          <a href="pembayaran.html" class="btn-clay-primary">
            <i class="ph ph-plus"></i> Buat Tagihan Baru
          </a>
        </div>

        <div class="filter-action-header-clay">

          <div class="search-wrapper-clay">
            <input type="text" id="cariNama" class="form-input-clay" placeholder="🔍 Cari nama penghuni..." />
          </div>

          <div class="filter-wrapper-clay">
            <select id="filterStatus" class="form-input-clay">
              <option value="semua">📊 Semua Status</option>
              <option value="belum_bayar">❌ Belum Lunas</option>
              <option value="lunas">✅ Sudah Lunas</option>
            </select>
          </div>

          <div class="filter-wrapper-clay">
            <select id="filterBulan" class="form-input-clay">
              <option value="semua">📅 Semua Bulan</option>
              <option value="1">Januari</option>
              <option value="2">Februari</option>
              <option value="3">Maret</option>
              <option value="4">April</option>
              <option value="5">Mei</option>
              <option value="6">Juni</option>
              <option value="7">Juli</option>
              <option value="8">Agustus</option>
              <option value="9">September</option>
              <option value="10">Oktober</option>
              <option value="11">November</option>
              <option value="12">Desember</option>
            </select>
          </div>

          <div class="filter-wrapper-clay-small">
            <select id="filterTahun" class="form-input-clay">
              <option value="semua">📆 Semua Tahun</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
              <option value="2026">2026</option>
            </select>
          </div>

          <div class="sort-wrapper-clay">
            <select id="sortData" class="form-input-clay">
              <option value="terbaru">✨ Terbaru</option>
              <option value="terlama">⏳ Terlama</option>
              <option value="nama_asc">🔤 Nama Penghuni (A → Z)</option>
            </select>
          </div>
        </div>

        <div class="table-wrapper">
          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Nama Penghuni</th>
                  <th>Nomor Kamar</th>
                  <th>Periode Tagihan</th>
                  <th>Nominal</th>
                  <th>Jatuh Tempo</th>
                  <th>Status Bayar</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tabelPembayaranBody">
                <tr>
                  <td colspan="7" class="text-center" style="color: var(--n400); padding: 30px;">
                    Memuat basis data pembayaran...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
      <div id="footer-container"></div>
    </div>
  </div>

  <script src="../../js/layout-admin.js"></script>
  <script src="../../js/admin/riwayat-pembayaran.js"></script>
</body>

</html>
