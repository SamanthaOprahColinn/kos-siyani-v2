<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Penghuni — Kos Siyani</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/admin/kelola-penghuni.css" />

</head>

<body>

    <div class="layout">
        <div id="sidebar-container"></div>

        <div class="main">
            <header class="topbar">
                <h1 class="topbar-title">Manajemen Penghuni Kos</h1>
                <div id="topbar-container"></div>
            </header>

            <main class="content page-enter">
                <div class="admin-grid-layout">

                    <div class="table-wrapper">
                        <div class="table-top">
                            <div>
                                <div class="table-top-title">Data Penghuni Aktif</div>
                                <div class="table-top-sub">Total penghuni terdaftar di database</div>
                            </div>
                            <button class="btn btn-ghost btn-sm" onclick="fetchPenghuni()">
                                <i class="ph ph-arrows-clockwise"></i> Segarkan
                            </button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Kamar</th>
                                    <th>Nama Lengkap</th>
                                    <th>Kontak & Email</th>
                                    <th>Status</th>
                                    <th style="text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tenantTableBody">
                                <tr>
                                    <td colspan="5" style="text-align: center; padding: 20px;">Menghubungkan ke database...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-wrapper quick-action-card">
                        <div class="card-section-title"><i class="ph ph-user-plus"></i> Registrasi Penghuni</div>
                        <div class="table-top-sub">Masukkan data sesuai KTP fisik</div>

                        <form id="formPenghuni" onsubmit="saveTenant(event)">

                            <div class="form-group">
                                <label>Nama Lengkap (Min 3 Karakter)</label>
                                <input type="text" id="tenantName" placeholder="Budi Santoso" required minlength="3"
                                    maxlength="100">
                            </div>

                            <div class="form-group">
                                <label>Nomor KTP (Wajib 16 Digit)</label>
                                <input type="text" id="tenantKtp" placeholder="3273123456789012" required minlength="16"
                                    maxlength="16">
                            </div>

                            <div class="form-group">
                                <label>Nomor HP (10 - 13 Digit)</label>
                                <input type="text" id="tenantHp" placeholder="081234567890" required minlength="10"
                                    maxlength="13">
                            </div>

                            <div class="form-group">
                                <label>Alamat Email</label>
                                <input type="email" id="tenantEmail" placeholder="budi@email.com" required>
                            </div>

                            <div class="form-group">
                                <label>Pilih Nomor Kamar</label>
                                <select id="tenantRoom" required>
                                    <option value="">-- Memuat Kamar... --</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Alamat Asal (Min 10 Karakter)</label>
                                <textarea id="tenantAddress" placeholder="Jl. Raya Kemerdekaan No. 45, Bandung" required
                                    minlength="10" rows="2"></textarea>
                            </div>

                            <button type="submit" id="btnSaveTenant" class="quick-action-btn qab-green">
                                <i class="ph ph-floppy-disk"></i> Simpan Data Penghuni
                            </button>
                        </form>
                    </div>

                </div>
            </main>

            <div id="footer-container"></div>
        </div>
    </div>

    <div class="modal-backdrop" id="editTenantModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="card-section-title" style="margin: 0;"><i class="ph ph-user-gear"></i> Edit Data Penghuni</div>
                <button type="button" class="modal-close-btn" onclick="closeEditModal()">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <form id="formEditPenghuni" onsubmit="updateTenant(event)">
                <input type="hidden" id="editTenantId">

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="editTenantName" required minlength="3" maxlength="100">
                </div>

                <div class="form-group">
                    <label>Nomor HP</label>
                    <input type="text" id="editTenantHp" required minlength="10" maxlength="13">
                </div>

                <div class="form-group">
                    <label>Alamat Email</label>
                    <input type="email" id="editTenantEmail" required>
                </div>

                <div class="form-group">
                    <label>Alamat Asal</label>
                    <textarea id="editTenantAddress" required minlength="10" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label>Status Penghuni</label>
                    <select id="editTenantStatus" required>
                        <option value="aktif">Aktif</option>
                        <option value="nonaktif">Non-Aktif</option>
                    </select>
                </div>

                <button type="submit" id="btnUpdateTenant" class="quick-action-btn qab-green" style="width: 100%; margin-top: 10px;">
                    <i class="ph ph-check"></i> Simpan Perubahan Data
                </button>
            </form>
        </div>
    </div>

    <script src="../../js/layout-admin.js"></script>

    <script>
        window.currentPenghuni = [];

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '../login.html'; return; }

            fetch('http://localhost:5000/api/auth/me', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.data) {
                        document.getElementById('profileName').textContent = data.data.nama_lengkap;
                        document.getElementById('avatarInitial').textContent = data.data.nama_lengkap.charAt(0).toUpperCase();
                    }
                }).catch(() => {
                    localStorage.removeItem('token');
                    window.location.href = '../login.html';
                });

            fetchPenghuni();
            fetchKamarPilihan();
        });

        function fetchKamarPilihan() {
            const token = localStorage.getItem('token');
            const selectKamar = document.getElementById('tenantRoom');

            selectKamar.innerHTML = '<option value="">-- Memuat Kamar... --</option>';

            fetch('http://localhost:5000/api/kamar?status=tersedia', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(res => res.json())
                .then(resData => {
                    selectKamar.innerHTML = '<option value="">-- Pilih Nomor Kamar --</option>';

                    const kamarList = resData.data?.data || resData.data || [];

                    if (kamarList.length > 0) {
                        kamarList.forEach(k => {
                            if (k.isDeleted === true) return;

                            const opt = document.createElement('option');
                            opt.value = k._id;

                            const nomor = k.nomor_kamar || k.no_kamar || '??';
                            const detailHarga = k.harga_sewa ? ` - (Rp ${Number(k.harga_sewa).toLocaleString('id-ID')})` : '';

                            if (k.status_kamar === 'tidak tersedia' || k.status_kamar === 'terisi') {
                                opt.disabled = true;
                                opt.textContent = `Kamar ${nomor} ${detailHarga} - [PENUH / TIDAK TERSEDIA]`;
                            } else {
                                opt.textContent = `Kamar ${nomor} ${detailHarga} - Tersedia`;
                            }

                            selectKamar.appendChild(opt);
                        });
                    } else {
                        selectKamar.innerHTML = '<option value="">Tidak ada kamar kosong yang tersedia</option>';
                    }
                })
                .catch(err => {
                    console.error('Gagal mengambil data kamar:', err);
                    selectKamar.innerHTML = '<option value="">Gagal memuat daftar kamar</option>';
                });
        }

        function fetchPenghuni() {
            const token = localStorage.getItem('token');
            const tbody = document.getElementById('tenantTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">Menarik data dari database...</td></tr>';

            fetch('http://localhost:5000/api/penghuni', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(res => res.json())
                .then(resData => {
                    tbody.innerHTML = '';
                    
                    // Supaya bisa kelacak kalau masih gagal
                    console.log("Cek Data Penghuni dari API:", resData);

                    // Filter array yang dilonggarkan biar datanya muncul!
                    const penghuniList = resData.data?.data || resData.data || (Array.isArray(resData) ? resData : []);

                    if (penghuniList.length > 0) {
                        window.currentPenghuni = penghuniList;

                        penghuniList.forEach(p => {
                            const tr = document.createElement('tr');
                            
                            const kamarData = p.id_kamar || p.kamar_id || {};
                            const nomorKamar = kamarData.nomor_kamar || kamarData.no_kamar || p.nomor_kamar || '??';
                            
                            const statusClass = String(p.status_penghuni || 'aktif').toLowerCase() === 'aktif' ? 'aktif' : 'nonaktif';

                            tr.innerHTML = `
                                <td class="font-bold">Kamar ${nomorKamar}</td>
                                <td style="font-weight: 600; color: var(--text-cozy);">${p.nama_lengkap || '-'}</td>
                                <td style="color: #8c737d; font-size: 12px;">
                                    <div><i class="ph ph-phone"></i> ${p.no_hp || p.nomor_hp || '-'}</div>
                                    <div><i class="ph ph-envelope"></i> ${p.email || '-'}</div>
                                </td>
                                <td><span class="status-dot ${statusClass}">${p.status_penghuni || 'Aktif'}</span></td>
                                <td>
                                    <div class="action-flex">
                                        <button class="btn btn-ghost btn-sm" style="color: #3182ce;" onclick="openEditModal('${p._id}')" title="Edit Data">
                                            <i class="ph ph-pencil-simple"></i>
                                        </button>
                                        <button class="btn btn-ghost btn-sm" style="color: #e53e3e;" onclick="deleteTenant('${p._id}')" title="Hapus Penghuni">
                                            <i class="ph ph-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5"><div class="table-empty"><i class="ph ph-users"></i><div class="table-empty-title">Belum ada penghuni terdaftar</div></div></td></tr>';
                    }
                })
                .catch(err => {
                    console.error("Error Fetch Penghuni:", err);
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data. Cek console browser.</td></tr>';
                });
        }

        function saveTenant(event) {
            event.preventDefault();

            const token = localStorage.getItem('token');
            const payload = {
                nama_lengkap: document.getElementById('tenantName').value.trim(),
                no_ktp: document.getElementById('tenantKtp').value.trim(),
                no_hp: document.getElementById('tenantHp').value.trim(),
                email: document.getElementById('tenantEmail').value.trim(),
                id_kamar: document.getElementById('tenantRoom').value,
                alamat_asal: document.getElementById('tenantAddress').value.trim()
            };

            const btn = document.getElementById('btnSaveTenant');
            btn.innerHTML = 'Menyimpan...';
            btn.style.pointerEvents = 'none';

            fetch('http://localhost:5000/api/penghuni', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(data => {
                    btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Data Penghuni';
                    btn.style.pointerEvents = 'auto';

                    if (data.success) {
                        alert('Data penghuni baru berhasil disimpan!');
                        document.getElementById('formPenghuni').reset();
                        fetchPenghuni();
                        fetchKamarPilihan();
                    } else {
                        alert('Gagal Validasi Backend: ' + (data.message || JSON.stringify(data.errors)));
                    }
                })
                .catch(() => {
                    btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Simpan Data Penghuni';
                    btn.style.pointerEvents = 'auto';
                    alert('Terjadi kesalahan koneksi.');
                });
        }

        function openEditModal(id) {
            const target = window.currentPenghuni.find(p => p._id === id);
            if (!target) return alert('Data tidak ditemukan!');

            document.getElementById('editTenantId').value = target._id;
            document.getElementById('editTenantName').value = target.nama_lengkap;
            document.getElementById('editTenantHp').value = target.no_hp || target.nomor_hp || '';
            document.getElementById('editTenantEmail').value = target.email || '';
            document.getElementById('editTenantAddress').value = target.alamat_asal || '';
            document.getElementById('editTenantStatus').value = target.status_penghuni || 'aktif';

            document.getElementById('editTenantModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editTenantModal').style.display = 'none';
            document.getElementById('formEditPenghuni').reset();
        }

        function updateTenant(event) {
            event.preventDefault();
            const token = localStorage.getItem('token');
            const id = document.getElementById('editTenantId').value;

            const payload = {
                nama_lengkap: document.getElementById('editTenantName').value.trim(),
                no_hp: document.getElementById('editTenantHp').value.trim(),
                email: document.getElementById('editTenantEmail').value.trim(),
                alamat_asal: document.getElementById('editTenantAddress').value.trim(),
                status_penghuni: document.getElementById('editTenantStatus').value
            };

            const btn = document.getElementById('btnUpdateTenant');
            btn.innerHTML = 'Memperbarui...';
            btn.style.pointerEvents = 'none';

            fetch(`http://localhost:5000/api/penghuni/${id}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(data => {
                    btn.innerHTML = '<i class="ph ph-check"></i> Simpan Perubahan Data';
                    btn.style.pointerEvents = 'auto';

                    if (data.success) {
                        alert('Data penghuni berhasil diperbarui!');
                        closeEditModal();
                        fetchPenghuni(); 
                        fetchKamarPilihan(); 
                    } else {
                        alert('Gagal memperbarui data: ' + data.message);
                    }
                })
                .catch(() => {
                    btn.innerHTML = '<i class="ph ph-check"></i> Simpan Perubahan Data';
                    btn.style.pointerEvents = 'auto';
                    alert('Terjadi kesalahan jaringan.');
                });
        }

        function deleteTenant(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus data penghuni ini?\nKamar yang bersangkutan otomatis akan kembali berstatus tersedia.')) return;

            const token = localStorage.getItem('token');

            fetch(`http://localhost:5000/api/penghuni/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert('Penghuni sukses dihapus dari database!');
                        fetchPenghuni(); 
                        fetchKamarPilihan(); 
                    } else {
                        alert('Gagal menghapus penghuni: ' + data.message);
                    }
                })
                .catch(() => {
                    alert('Terjadi masalah koneksi saat menghapus data.');
                });
        }
    </script>
</body>

</html>
