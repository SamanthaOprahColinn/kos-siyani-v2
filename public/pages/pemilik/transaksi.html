<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transaksi — Kos Siyani</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/pemilik/dashboard.css" />
    <link rel="stylesheet" href="../../css/pemilik/transaksi.css" />
</head>
<body>
    <div class="layout">
        <div id="sidebar-container"></div>
        <div class="main">
            <header class="topbar">
                <h1 class="topbar-title">Data Transaksi & Tagihan</h1>
                <div id="topbar-container"></div>
            </header>

            <main class="content page-enter">
                <div class="table-wrapper" style="width: 100%;">
                    <div class="table-top">
                        <div>
                            <div class="table-top-title">Riwayat Pembayaran Sewa</div>
                            <div class="table-top-sub">Pantau pendapatan dan verifikasi bukti transfer dari penghuni</div>
                        </div>
                        <button class="btn btn-ghost btn-sm" onclick="fetchTransaksi()">
                            <i class="ph ph-arrows-clockwise" style="font-size: 18px;"></i> Segarkan
                        </button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Penghuni</th>
                                <th>Kamar</th>
                                <th>Periode</th>
                                <th>Total Tagihan</th>
                                <th>Status</th>
                                <th style="text-align: center;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transaksiTableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 20px;">Memuat data transaksi...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
            <div id="footer-container"></div>
        </div>
    </div>

    <div id="verifikasiModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Verifikasi Pembayaran</h3>
            
            <div class="image-preview-container">
                <p class="image-preview-label">Gambar Bukti Transfer:</p>
                
                <div id="loadingBukti" class="loading-text">
                    <i class="ph ph-spinner-gap spin-icon"></i> Memuat bukti...
                </div>
                
                <img id="previewBukti" class="preview-img" src="" alt="Bukti Transfer">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-batal" onclick="closeVerifikasiModal()">Batal</button>
                <button type="button" id="btnTolak" class="btn-tolak" onclick="prosesVerifikasi('ditolak')">Tolak</button>
                <button type="button" id="btnSetuju" class="btn-setuju" onclick="prosesVerifikasi('lunas')">Valid (Lunas)</button>
            </div>
        </div>
    </div>

    <script src="../../js/layout-pemilik.js"></script>
    <script src="../../js/pemilik/transaksi.js"></script>
</body>
</html>
