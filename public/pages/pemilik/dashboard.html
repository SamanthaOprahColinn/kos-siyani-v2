<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Owner — Kos Siyani</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
  <link rel="stylesheet" href="../../css/global.css"/>
  <link rel="stylesheet" href="../../css/pemilik/dashboard.css"/>

</head>
<body>

<div class="layout">
  
  <div id="sidebar-container"></div>

  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">Dashboard Pemilik</h1>
      
      <div id="topbar-container"></div>
    </header>

    <main class="content page-enter">
      <div class="admin-stats" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px;">
        <div class="stat-card">
          <div class="stat-icon stat-icon-pink"><i class="ph ph-house-line"></i></div>
          <div>
            <div class="stat-label">Total Kamar</div>
            <div class="stat-value" id="statTotalKamar">-</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon stat-icon-green"><i class="ph ph-users"></i></div>
          <div>
            <div class="stat-label">Penghuni Aktif</div>
            <div class="stat-value" id="statPenghuniAktif">-</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon stat-icon-cream"><i class="ph ph-door"></i></div>
          <div>
            <div class="stat-label">Kamar Tersedia</div>
            <div class="stat-value" id="statKamarTersedia">-</div>
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background: var(--green-50); color: var(--green-600);"><i class="ph ph-wallet"></i></div>
          <div>
            <div class="stat-label">Pemasukan Bulan Ini</div>
            <div class="stat-value" id="statPemasukan" style="font-size: var(--text-xl); margin-top: 4px;">-</div>
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-top">
          <div>
            <div class="table-top-title">Ikhtisar Pembayaran Kamar</div>
            <div class="table-top-sub">Data real-time dari database</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="fetchPembayaran()">
            <i class="ph ph-arrows-clockwise"></i> Segarkan
          </button>
        </div>
        <table>
          <thead>
            <tr>
              <th>No. Kamar</th>
              <th>Nama Penghuni</th>
              <th>Status Pembayaran</th>
            </tr>
          </thead>
          <tbody id="paymentTableBody">
            <tr>
              <td colspan="3" style="text-align: center; padding: 20px;">Menghubungkan ke database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    
    <div id="footer-container"></div>
  </div>
</div>

<div class="modal-backdrop" id="adminModal" style="display: none;">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Tambah Akun Admin Baru</h3>
      <button onclick="closeAdminModal()" style="font-size: 20px; background: none; border: none; cursor: pointer;">
        <i class="ph ph-x"></i>
      </button>
    </div>
    
    <div class="error-box" id="adminErrorBox" style="margin-bottom: 12px; display: none;">
      <i class="ph ph-warning-circle"></i>
      <span id="adminErrorMsg"></span>
    </div>
    
    <div class="flex flex-col gap-4">
      <div class="form-group">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" class="form-input" id="adminName" placeholder="Masukkan nama lengkap admin"/>
      </div>
      <div class="form-group">
        <label class="form-label">Email Admin</label>
        <input type="email" class="form-input" id="adminEmail" placeholder="contoh: admin2@kosiyani.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap" style="position: relative;">
          <input type="password" class="form-input has-toggle" id="adminPassword" placeholder="Minimal 8 karakter kombinasi"/>
          <button type="button" class="pw-toggle" onclick="toggleAdminPw()" style="position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer;">
            <i class="ph ph-eye" id="adminPwIcon"></i>
          </button>
        </div>
      </div>
      <button class="btn btn-primary w-full" id="btnSaveAdmin" onclick="saveAdmin()">Daftarkan Admin</button>
    </div>
  </div>
</div>

<script src="../../js/layout-pemilik.js"></script>
<script src="../../js/pemilik/dashboard-pemilik.js"></script>

</body>
</html>
