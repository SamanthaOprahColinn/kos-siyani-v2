<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Kamar — Kos Siyani</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/pemilik/dashboard.css" />
    <link rel="stylesheet" href="../../css/pemilik/kelola-kamar.css" />
</head>
<body>
    <div class="layout">
        <div id="sidebar-container"></div>
        <div class="main">
            <header class="topbar">
                <h1 class="topbar-title">Data Kamar Kos</h1>
                <div id="topbar-container"></div>
            </header>

            <main class="content page-enter">
                <div class="table-wrapper" style="width: 100%;">
                    <div class="table-top">
                        <div>
                            <div class="table-top-title">Daftar Kamar Kos</div>
                            <div class="table-top-sub">Monitoring status ketersediaan & fasilitas</div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-primary btn-sm" onclick="openModal()">+ Tambah Kamar</button>
                            <button class="btn btn-ghost btn-sm" onclick="fetchKamar()"><i class="ph ph-arrows-clockwise"></i></button>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>No. Kamar</th>
                                <th>Tipe / Lantai</th>
                                <th>Harga</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="kamarTableBody">
                            <tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
            <div id="footer-container"></div>
        </div>
    </div>

    <div id="kamarModal" class="modal-overlay">
        <div class="modal-content">
            <h3>Tambah Kamar Baru</h3>
            <form id="formKamar" onsubmit="addKamar(event)">
                <input type="number" id="nomor_kamar" placeholder="Nomor Kamar (1-10)" min="1" max="10" required>
                
                <select id="lantai" required>
                    <option value="" disabled selected>Pilih Lantai</option>
                    <option value="1">Lantai 1</option>
                    <option value="2">Lantai 2</option>
                </select>

                <select id="tipe_kamar" required>
                    <option value="" disabled selected>Pilih Tipe Kamar</option>
                    <option value="A">Tipe A</option>
                    <option value="B">Tipe B</option>
                    <option value="C">Tipe C</option>
                </select>

                <input type="number" id="harga_sewa" placeholder="Harga Sewa (Contoh: 1000000)" required>
                <input type="text" id="fasilitas" placeholder="Fasilitas (Contoh: AC, Lemari)" required>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveKamar">Simpan Kamar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/layout-pemilik.js"></script>
    <script src="../../js/pemilik/kelola-kamar.js"></script>
</body>
</html>
