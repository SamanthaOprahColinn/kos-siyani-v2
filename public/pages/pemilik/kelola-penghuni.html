<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kelola Penghuni — Kos Siyani</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="/css/global.css"/>
<link rel="stylesheet" href="/css/pemilik/dashboard.css"/> 
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-logo">KS</div>
      <div>
        <div class="sidebar-brand-name">Kos Siyani</div>
        <div class="sidebar-brand-sub">Admin Panel v2</div>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Utama</div>
      <a href="/pages/pemilik/dashboard.html" class="sidebar-link">
        <i class="ph ph-squares-four sidebar-link-icon"></i>
        <span>Dashboard</span>
      </a>
      
      <div class="sidebar-section-title">Manajemen</div>
      <a href="#" class="sidebar-link" onclick="alert('Modul Kelola Kamar segera hadir')">
        <i class="ph ph-door-open sidebar-link-icon"></i>
        <span>Kelola Kamar</span>
      </a>
      <a href="/pages/pemilik/kelola-penghuni.html" class="sidebar-link active">
        <i class="ph ph-users sidebar-link-icon"></i>
        <span>Kelola Penghuni</span>
      </a>
      <a href="#" class="sidebar-link" onclick="alert('Modul Transaksi segera hadir')">
        <i class="ph ph-receipt sidebar-link-icon"></i>
        <span>Transaksi</span>
      </a>
      
      <div class="sidebar-section-title">Akun</div>
      <a href="#" class="sidebar-link" onclick="handleLogout()">
        <i class="ph ph-sign-out sidebar-link-icon"></i>
        <span>Keluar</span>
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="topbar-title">Manajemen Penghuni Kos</h1>
      
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="font-bold text-dark" id="profileName">Memuat...</div>
          <span class="badge badge-pink text-xs">PEMILIK</span>
        </div>
      </div>
    </header>

    <main class="content page-enter">
      <div class="flex items-center justify-between mb-6 gap-4">
        <div class="flex items-center gap-2" style="flex: 1; max-width: 400px;">
          <input type="text" id="searchPenghuni" class="form-input" placeholder="Cari nama atau no. hp penghuni..." oninput="debounceSearch()"/>
        </div>
        <button class="btn btn-primary" onclick="openPenghuniModal()">
          <i class="ph ph-user-plus"></i> Tambah Penghuni Baru
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Lengkap</th>
              <th>Kontak / Email</th>
              <th>Tanggal Masuk</th>
              <th>Status</th>
              <th style="text-align: center;">Aksi</th>
            </tr>
          </thead>
          <tbody id="penghuniTableBody">
            <tr>
              <td colspan="6" style="text-align: center; padding: 20px;">Menghubungkan ke database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="penghuniModal" style="display: none;">
  <div class="modal" style="max-width: 550px;">
    <div class="modal-header">
      <h3 class="modal-title">Registrasi Penghuni Baru</h3>
      <button onclick="closePenghuniModal()" style="font-size: 20px;"><i class="ph ph-x"></i></button>
    </div>
    <form id="formPenghuni" onsubmit="savePenghuni(event)">
      <div class="grid-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" class="form-input" id="pNama" required placeholder="Nama sesuai KTP"/>
        </div>
        <div class="form-group">
          <label class="form-label">No. KTP</label>
          <input type="text" class="form-input" id="pKtp" required placeholder="16 Digit No. KTP"/>
        </div>
      </div>
      <div class="grid-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
        <div class="form-group">
          <label class="form-label">No. HP / WhatsApp</label>
          <input type="text" class="form-input" id="pHp" required placeholder="Contoh: 0812345678"/>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="pEmail" required placeholder="Alamat email aktif"/>
        </div>
      </div>
      <div class="form-group mb-3">
        <label class="form-label">Alamat Asal</label>
        <input type="text" class="form-input" id="pAlamat" required placeholder="Alamat rumah asal sesuai KTP"/>
      </div>
      <div class="grid-2 gap-4" style="display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px;">
        <div class="form-group">
          <label class="form-label">Pilih Kamar</label>
          <select class="form-input" id="pKamar" required>
            <option value="">-- Pilih Kamar --</option>
            </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tanggal Masuk</label>
          <input type="date" class="form-input" id="pTanggalMasuk" required/>
        </div>
      </div>
      <div class="form-group mb-4">
        <label class="form-label">Catatan Tambahan (Opsional)</label>
        <textarea class="form-input" id="pCatatan" rows="2" placeholder="Catatan fasilitas tambahan atau jaminan"></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-full" id="btnSubmitPenghuni">Simpan & Daftarkan</button>
    </form>
  </div>
</div>

<script>
const API_URL = 'http://localhost:5000/api';
let searchTimeout;

document.addEventListener('DOMContentLoaded', () => {
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = '/pages/login.html';
    return;
  }

  // Ambil Data Profil User untuk Topbar
  fetch(`${API_URL}/auth/me`, {
    headers: { 'Authorization': `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success && data.data) {
      document.getElementById('profileName').textContent = data.data.nama_lengkap;
    }
  });

  // Load Data Utama
  fetchPenghuni();
  fetchKamarOptions();
});

// --- 1. MEMUAT DATA PENGHUNI ---
function fetchPenghuni(searchQuery = '') {
  const token = localStorage.getItem('token');
  const tbody = document.getElementById('penghuniTableBody');
  tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Memuat data penghuni...</td></tr>';

  let url = `${API_URL}/penghuni`;
  if (searchQuery) {
    url = `${API_URL}/penghuni/search?q=${encodeURIComponent(searchQuery)}`;
  }

  fetch(url, {
    headers: { 'Authorization': `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(resData => {
    tbody.innerHTML = '';
    
    // Sesuaikan dengan struktur response wrapper backend kamu
    const daftar = resData.data.penghuni || resData.data.data || resData.data;

    if (resData.success && daftar && daftar.length > 0) {
      daftar.forEach((p, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>
            <div class="font-bold text-dark">${p.nama_lengkap}</div>
            <span class="text-xs text-muted">KTP: ${p.no_ktp}</span>
          </td>
          <td>
            <div>${p.no_hp}</div>
            <span class="text-xs text-muted">${p.email}</span>
          </td>
          <td>${new Date(p.tanggal_masuk).toLocaleDateString('id-ID')}</td>
          <td><span class="badge ${p.status_penghuni === 'aktif' ? 'badge-success' : 'badge-danger'}">${p.status_penghuni}</span></td>
          <td style="text-align: center;">
            <button class="btn btn-ghost btn-sm text-danger" onclick="deletePenghuni('${p._id}')" title="Hapus Penghuni">
              <i class="ph ph-trash" style="font-size: 18px;"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Tidak ada data penghuni ditemukan.</td></tr>';
    }
  })
  .catch(err => {
    console.error(err);
    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px; color: red;">Gagal mengambil data dari server.</td></tr>';
  });
}

// --- 2. FITUR PENCARIAN (DEBOUNCE) ---
function debounceSearch() {
  clearTimeout(searchTimeout);
  const q = document.getElementById('searchPenghuni').value.trim();
  searchTimeout = setTimeout(() => {
    fetchPenghuni(q);
  }, 500); // Menunggu 0.5 detik setelah ketikan berhenti baru tembak API
}

// --- 3. MEMUAT PILIHAN KAMAR DI FORM ---
function fetchKamarOptions() {
  const token = localStorage.getItem('token');
  const selectKamar = document.getElementById('pKamar');

  fetch(`${API_URL}/kamar`, {
    headers: { 'Authorization': `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(resData => {
    const listKamar = resData.data.kamar || resData.data;
    if (listKamar && listKamar.length > 0) {
      listKamar.forEach(k => {
        // Hanya tampilkan kamar yang statusnya masih tersedia
        if (k.status_kamar === 'tersedia') {
          const opt = document.createElement('option');
          opt.value = k._id;
          opt.textContent = `Kamar ${k.nomor_kamar} (${k.tipe_kamar})`;
          selectKamar.appendChild(opt);
        }
      });
    }
  });
}

// --- 4. TAMBAH DATA PENGHUNI ---
function savePenghuni(event) {
  event.preventDefault();
  const token = localStorage.getItem('token');
  const btn = document.getElementById('btnSubmitPenghuni');

  const payload = {
    nama_lengkap: document.getElementById('pNama').value.trim(),
    no_ktp: document.getElementById('pKtp').value.trim(),
    no_hp: document.getElementById('pHp').value.trim(),
    email: document.getElementById('pEmail').value.trim(),
    alamat_asal: document.getElementById('pAlamat').value.trim(),
    id_kamar: document.getElementById('pKamar').value,
    tanggal_masuk: document.getElementById('pTanggalMasuk').value,
    catatan: document.getElementById('pCatatan').value.trim()
  };

  btn.style.pointerEvents = 'none';
  btn.textContent = 'Mendaftarkan...';

  fetch(`${API_URL}/penghuni`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    btn.style.pointerEvents = 'auto';
    btn.textContent = 'Simpan & Daftarkan';

    if (data.success) {
      alert(data.message || 'Penghuni baru berhasil didaftarkan!');
      closePenghuniModal();
      fetchPenghuni(); // Refresh tabel
    } else {
      alert(data.message || 'Gagal mendaftarkan penghuni.');
    }
  })
  .catch(err => {
    btn.style.pointerEvents = 'auto';
    btn.textContent = 'Simpan & Daftarkan';
    console.error(err);
    alert('Terjadi kesalahan jaringan.');
  });
}

// --- 5. HAPUS DATA (SOFT DELETE) ---
function deletePenghuni(id) {
  if (!confirm('Apakah Anda yakin ingin menghapus penghuni ini dari daftar aktif?')) return;
  
  const token = localStorage.getItem('token');
  fetch(`${API_URL}/penghuni/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${token}` }
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert('Penghuni berhasil dihapus.');
      fetchPenghuni(); // Refresh tabel
    } else {
      alert(data.message || 'Gagal menghapus data.');
    }
  });
}

// --- 6. MODAL WINDOW CONTROL ---
function openPenghuniModal() {
  document.getElementById('formPenghuni').reset();
  document.getElementById('penghuniModal').style.display = 'flex';
}

function closePenghuniModal() {
  document.getElementById('penghuniModal').style.display = 'none';
}

function handleLogout() {
  localStorage.removeItem('token');
  window.location.href = '/pages/login.html';
}
</script>
</body>
</html>
