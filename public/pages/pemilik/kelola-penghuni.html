<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelola Penghuni — Kos Siyani</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/pemilik/dashboard.css" />
</head>
<body>

    <div class="layout">
        <div id="sidebar-container"></div>
        <div class="main">
            <header class="topbar">
                <h1 class="topbar-title">Data Penghuni Kos</h1>
                <div id="topbar-container"></div>
            </header>

            <main class="content page-enter">
                
                <div class="kamar-top-action-bar">
                    <!-- Kolom Pencarian -->
                    <div class="filter-action-header-clay">
                        <div class="search-wrapper-clay">
                            <i class="ph ph-magnifying-glass search-icon-clay"></i>
                            <input type="text" id="searchPenghuni" class="form-input-clay" placeholder="Cari nama, no. kamar, atau email..." oninput="renderTable()">
                        </div>
                    </div>
                    
                    <select id="filterStatus" class="filter-dropdown-clay" onchange="renderTable()">
                        <option value="aktif">Status: Aktif</option>
                        <option value="keluar">Status: Keluar (Riwayat)</option>
                        <option value="semua">Status: Semua</option>
                    </select>
                </div>

                <div class="table-wrapper">
                    <div class="table-top">
                        <div>
                            <div class="table-top-title">Daftar Seluruh Penghuni</div>
                            <div class="table-top-sub">Monitoring data penghuni terdaftar</div>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Kamar & Tipe</th>
                                <th>Nama Lengkap</th>
                                <th>Kontak & Email</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tenantTableBody">
                            <tr><td colspan="4" style="text-align: center; padding: 20px;">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
            <div id="footer-container"></div>
        </div>
    </div>

    <script src="../../js/layout-pemilik.js"></script>
    <script src="../../js/pemilik/kelola-penghuni.js"></script>
</body>
</html>
